<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda de Festas 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a0f;
--card:#12121a;
--card-hover:#1a1a26;
--border:#1e1e2e;
--text:#e8e6f0;
--muted:#7a7890;
--accent-purple:#a78bfa;
--accent-teal:#2dd4bf;
--accent-coral:#fb923c;
--accent-pink:#f472b6;
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.glow-orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none;z-index:0;}
.glow-1{width:500px;height:500px;background:#a78bfa;top:-150px;left:-100px;}
.glow-2{width:400px;height:400px;background:#2dd4bf;bottom:-100px;right:-80px;}
.glow-3{width:300px;height:300px;background:#fb923c;top:50%;left:50%;transform:translate(-50%,-50%);}
.container{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:2rem 1.5rem 4rem;}
header{text-align:center;margin-bottom:3rem;}
header h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-0.03em;line-height:1.1;background:linear-gradient(135deg,#a78bfa 0%,#2dd4bf 50%,#fb923c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;}
header p{font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.stats-row{display:grid;gap:12px;margin-bottom:2.5rem;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.25rem;text-align:center;transition:border-color .3s;}
.stat-card:hover{border-color:#a78bfa44;}
.stat-card .number{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700;font-family:'Space Mono',monospace;}
.stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
.stat-card:nth-child(1) .number{color:var(--accent-purple);}
.stat-card:nth-child(2) .number{color:var(--accent-teal);}
.timeline{position:relative;display:flex;flex-direction:column;gap:1.5rem;}
.timeline::before{content:'';position:absolute;left:28px;top:30px;bottom:30px;width:2px;background:linear-gradient(180deg,var(--accent-purple),var(--accent-teal),var(--accent-coral));border-radius:2px;opacity:.3;}
.event-card{position:relative;margin-left:60px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.5rem;transition:all .35s cubic-bezier(.4,0,.2,1);cursor:default;}
.event-card:hover{background:var(--card-hover);transform:translateY(-2px);border-color:var(--event-color);box-shadow:0 8px 40px -12px var(--event-glow);}
.event-card .dot{position:absolute;left:-44px;top:1.75rem;width:16px;height:16px;border-radius:50%;background:var(--event-color);box-shadow:0 0 12px var(--event-glow);border:3px solid var(--bg);}
.event-card .dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--event-color);opacity:.3;animation:pulse-ring 2s infinite;}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.3;}100%{transform:scale(1.8);opacity:0;}}
.event-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:1rem;}
.event-name{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:700;letter-spacing:-0.01em;}
.event-date-badge{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;padding:6px 14px;border-radius:100px;background:var(--event-color);color:var(--bg);white-space:nowrap;letter-spacing:.03em;}
.event-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem;}
.meta-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:12px;color:var(--muted);}
.meta-pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}
.meta-pill.warn{color:var(--accent-coral);border-color:rgba(251,146,60,.15);}
.meta-pill.danger{color:var(--accent-pink);border-color:rgba(244,114,182,.15);}
.meta-pill.ok{color:var(--accent-teal);border-color:rgba(45,212,191,.15);}
.countdown-section{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:1rem;}
.countdown-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;font-family:'Space Mono',monospace;}
.countdown-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;}
.cd-unit{background:rgba(255,255,255,.03);border-radius:10px;padding:10px 4px;}
.cd-unit .val{font-family:'Space Mono',monospace;font-size:clamp(1.2rem,3vw,1.8rem);font-weight:700;color:var(--event-color);display:block;line-height:1;}
.cd-unit .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;display:block;}
.progress-bar{margin-top:12px;height:4px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;}
.progress-bar .fill{height:100%;border-radius:4px;background:var(--event-color);transition:width .5s;}
footer{text-align:center;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border);}
footer p{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:.04em;}
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:'Space Mono',monospace;color:var(--accent-teal);margin-top:6px;letter-spacing:.03em;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-teal);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
@media(max-width:600px){.stats-row{grid-template-columns:1fr!important;}.countdown-grid{gap:6px;}.event-card{margin-left:50px;padding:1.2rem;}.timeline::before{left:23px;}.event-card .dot{left:-38px;}.container{padding:1.5rem 1rem 3rem;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.event-card{animation:fadeUp .6s ease both;}.event-card:nth-child(1){animation-delay:.1s;}.event-card:nth-child(2){animation-delay:.25s;}.event-card:nth-child(3){animation-delay:.4s;}
.stat-card{animation:fadeUp .5s ease both;}.stat-card:nth-child(1){animation-delay:0s;}.stat-card:nth-child(2){animation-delay:.1s;}
.rsvp-section{margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.06);}
.rsvp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.rsvp-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:'Space Mono',monospace;}
.rsvp-count{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--event-color);}
.rsvp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
@media(max-width:480px){.rsvp-grid{grid-template-columns:repeat(2,1fr);}}
.rsvp-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);cursor:pointer;transition:all .2s;user-select:none;}
.rsvp-item:hover{background:rgba(255,255,255,.06);}
.rsvp-item.checked{border-color:var(--event-color);background:rgba(255,255,255,.05);}
.rsvp-check{width:20px;height:20px;border-radius:6px;flex-shrink:0;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;transition:all .2s;}
.rsvp-item.checked .rsvp-check{border-color:var(--event-color);background:var(--event-color);}
.rsvp-check svg{width:12px;height:12px;stroke:#0a0a0f;stroke-width:3;fill:none;opacity:0;transition:opacity .2s;}
.rsvp-item.checked .rsvp-check svg{opacity:1;}
.rsvp-name{font-size:13px;color:var(--muted);transition:color .2s;}
.rsvp-item.checked .rsvp-name{color:var(--text);font-weight:500;}
</style>
</head>
<body>
<div class="noise"></div>
<div class="glow-orb glow-1"></div>
<div class="glow-orb glow-2"></div>
<div class="glow-orb glow-3"></div>
<div class="container">
<header>
<h1>Agenda de Festas 2026</h1>
<p>Bem vindos a Gestão Raposo para as próximas festas do ano!</p>
<div class="sync-badge"><span class="sync-dot"></span> Sincronizado em tempo real</div>
</header>
<div class="stats-row" style="grid-template-columns:repeat(2,1fr);">
<div class="stat-card"><div class="number" id="total-events">3</div><div class="label">Eventos</div></div>
<div class="stat-card"><div class="number" id="next-days">--</div><div class="label">Dias pro proximo</div></div>
</div>
<div class="timeline" id="timeline"></div>
<footer><p>Atualizado em <span id="update-date"></span></p></footer>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ============================================================
// COLE SUAS CREDENCIAIS DO FIREBASE AQUI
// ============================================================
var firebaseConfig = {
  apiKey: "AIzaSyAXxd17zyAESAh_AI4FYLYbMkyA31gagH8",
  authDomain: "gestao-raposo.firebaseapp.com",
  databaseURL: "https://gestao-raposo-default-rtdb.firebaseio.com",
  projectId: "gestao-raposo"
};
// ============================================================
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var events = [
  {name:"Baile do Momo",date:new Date(2026,5,13,23,0),location:"Casa NTX",city:"Porto Alegre, RS",price:"R$ 140,00",priceStatus:"ok",priceNote:"valor atual",housing:false,housingNote:null,color:"#a78bfa",glow:"rgba(167,139,250,.25)",instagram:"https://www.instagram.com/bailedomomo/"},
  {name:"Esbórnia Porto Alegre",date:new Date(2026,5,19,23,0),location:"Local a definir",city:"Porto Alegre, RS",price:"A definir",priceStatus:"warn",priceNote:"vendas nao abertas",housing:false,housingNote:null,color:"#2dd4bf",glow:"rgba(45,212,191,.25)",instagram:"https://www.instagram.com/curtaesbornia/"},
  {name:"Esbórnia Gramado",date:new Date(2026,7,22,23,0),location:"Expogramado",city:"Gramado, RS",price:"A definir",priceStatus:"warn",priceNote:"vendas nao abertas",housing:true,housingNote:"Airbnb ~R$ 300/pessoa",color:"#fb923c",glow:"rgba(251,146,60,.25)",instagram:"https://www.instagram.com/p/DWpDruvmVDR/?img_index=3"}
];
var friends = ["Lovisi","Marrom","Zé","Leonel","Meira","Dima","Poze","Mr","Kauan","Wellington"];
var timeline = document.getElementById("timeline");
var now = new Date();

function getCountdown(t){var d=t-now;if(d<=0)return{days:0,hours:0,mins:0,secs:0,total:0};return{days:Math.floor(d/864e5),hours:Math.floor(d%864e5/36e5),mins:Math.floor(d%36e5/6e4),secs:Math.floor(d%6e4/1e3),total:d};}
function getProgress(t){var s=t-new Date(2026,3,7),e=now-new Date(2026,3,7);return Math.min(100,Math.max(0,e/s*100));}
function formatDate(d){var m=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],w=["dom","seg","ter","qua","qui","sex","sab"];return(d.getDate()<10?"0":"")+d.getDate()+" "+m[d.getMonth()]+" — "+w[d.getDay()];}

function updateCount(section, data){
  var c = 0;
  friends.forEach(function(f){ if(data && data[f]) c++; });
  section.querySelector(".rsvp-count").textContent = c + "/" + friends.length + " confirmados";
}

function syncCheckboxes(section, data){
  section.querySelectorAll(".rsvp-item").forEach(function(item){
    var f = item.dataset.friend;
    if(data && data[f]){
      item.classList.add("checked");
    } else {
      item.classList.remove("checked");
    }
  });
  updateCount(section, data);
}

var closestDays = Infinity;
events.forEach(function(ev){var cd=getCountdown(ev.date);if(cd.total>0&&cd.days<closestDays)closestDays=cd.days;});
document.getElementById("next-days").textContent = closestDays===Infinity ? "--" : closestDays;

events.forEach(function(ev, i){
  var cd=getCountdown(ev.date), prog=getProgress(ev.date);
  var card=document.createElement("div");
  card.className="event-card";
  card.style.setProperty("--event-color",ev.color);
  card.style.setProperty("--event-glow",ev.glow);

  var locI='<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  var monI='<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>';
  var homI='<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  var igI='<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--event-color);fill:none;stroke-width:2;flex-shrink:0;cursor:pointer;transition:opacity .2s;" onmouseover="this.style.opacity=\'0.7\'" onmouseout="this.style.opacity=\'1\'"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="var(--event-color)" stroke="none"/></svg>';
  var chk='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

  var rsvpH = "";
  friends.forEach(function(f){
    rsvpH += '<div class="rsvp-item" data-friend="'+f+'" data-event="'+i+'"><div class="rsvp-check">'+chk+'</div><span class="rsvp-name">'+f+'</span></div>';
  });

  card.innerHTML =
    '<div class="dot"></div>' +
    '<div class="event-top"><div style="display:flex;align-items:center;gap:8px;"><div class="event-name">'+ev.name+'</div><a href="'+ev.instagram+'" target="_blank" rel="noopener" title="Ver no Instagram">'+igI+'</a></div><div class="event-date-badge">'+formatDate(ev.date)+'</div></div>' +
    '<div class="event-meta"><span class="meta-pill">'+locI+' '+ev.location+' — '+ev.city+'</span><span class="meta-pill '+ev.priceStatus+'">'+monI+' '+ev.price+' <span style="opacity:.6;font-size:11px">'+ev.priceNote+'</span></span>'+(ev.housing?'<span class="meta-pill danger">'+homI+' '+ev.housingNote+'</span>':'<span class="meta-pill ok">'+homI+' Sem hospedagem</span>')+'</div>' +
    '<div class="countdown-section"><div class="countdown-label">Contagem regressiva</div><div class="countdown-grid" data-target="'+ev.date.getTime()+'"><div class="cd-unit"><span class="val" data-cd="days">'+cd.days+'</span><span class="lbl">Dias</span></div><div class="cd-unit"><span class="val" data-cd="hours">'+cd.hours+'</span><span class="lbl">Horas</span></div><div class="cd-unit"><span class="val" data-cd="mins">'+cd.mins+'</span><span class="lbl">Min</span></div><div class="cd-unit"><span class="val" data-cd="secs">'+cd.secs+'</span><span class="lbl">Seg</span></div></div><div class="progress-bar"><div class="fill" style="width:'+prog+'%"></div></div></div>' +
    '<div class="rsvp-section" data-event-idx="'+i+'"><div class="rsvp-header"><span class="rsvp-label">Quem vai?</span><span class="rsvp-count">0/'+friends.length+' confirmados</span></div><div style="font-size:11px;color:#f472b6;margin-bottom:10px;font-family:\'Space Mono\',monospace;letter-spacing:.02em;">* Só confirme se realmente for na festa!</div><div class="rsvp-grid">'+rsvpH+'</div></div>';

  timeline.appendChild(card);

  // LISTENER EM TEMPO REAL DO FIREBASE
  db.ref("rsvp/evento_" + i).on("value", function(snapshot){
    var data = snapshot.val() || {};
    var section = card.querySelector(".rsvp-section");
    syncCheckboxes(section, data);
  });
});

// CLICK HANDLER — SALVA NO FIREBASE
document.addEventListener("click", function(e){
  var item = e.target.closest(".rsvp-item");
  if(!item) return;
  var idx = item.dataset.event;
  var f = item.dataset.friend;
  var isChecked = !item.classList.contains("checked");
  // Salva direto no Firebase — o listener .on("value") atualiza a UI
  db.ref("rsvp/evento_" + idx + "/" + f).set(isChecked);
});

// COUNTDOWN TICK
function tick(){
  var n=new Date();
  document.querySelectorAll(".countdown-grid").forEach(function(g){
    var t=new Date(parseInt(g.dataset.target)),d=t-n;
    if(d<=0){g.querySelector("[data-cd=days]").textContent="0";g.querySelector("[data-cd=hours]").textContent="0";g.querySelector("[data-cd=mins]").textContent="0";g.querySelector("[data-cd=secs]").textContent="0";return;}
    g.querySelector("[data-cd=days]").textContent=Math.floor(d/864e5);
    g.querySelector("[data-cd=hours]").textContent=Math.floor(d%864e5/36e5);
    g.querySelector("[data-cd=mins]").textContent=Math.floor(d%36e5/6e4);
    g.querySelector("[data-cd=secs]").textContent=Math.floor(d%6e4/1e3);
  });
}
setInterval(tick,1000);

var d=new Date();
document.getElementById("update-date").textContent=(d.getDate()<10?"0":"")+d.getDate()+"/"+(d.getMonth()<9?"0":"")+(d.getMonth()+1)+"/"+d.getFullYear();
</script>
</body>
</html>
